{% extends "base.html" %}
{% block title %}Sign Up — Samlovesbooks{% endblock %}

{% block content %}
  <div class="form-narrow">
    <h1 class="page-title">Sign up</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post">
      <div class="form-field">
        <label for="display_name">Display name</label>
        <input type="text" id="display_name" name="display_name" value="{{ display_name or '' }}" required>
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">Create account</button>
    </form>
    <p class="form-note">Already have an account? <a href="{{ url_for('account.login') }}">Log in</a></p>
  </div>
{% endblock %}
