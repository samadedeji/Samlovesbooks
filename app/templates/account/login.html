{% extends "base.html" %}
{% block title %}Log In — Samlovesbooks{% endblock %}

{% block content %}
  <div class="form-narrow">
    <h1 class="page-title">Log in</h1>
    {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn">Log in</button>
    </form>
    <p class="form-note">New here? <a href="{{ url_for('account.signup') }}">Create an account</a></p>
  </div>
{% endblock %}
